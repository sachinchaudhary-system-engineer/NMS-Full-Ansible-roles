---
# Variables for every server

ansible_user: ansible            # the admin user that exists on every server
timezone: UTC
dns_domain: client.local

# Internal time source(s). Fill in your own, for example ["10.0.0.5"]
ntp_servers: []

# Where the offline repository lives on every server
offline_repo_dir: /opt/offline-repo

# Names and addresses of all servers, written into /etc/hosts when no DNS exists
# (filled in during step 3 of the plan)

# Folder with the unpacked offline bundle, on the controller (the machine running Ansible)
bundle_dir: "{{ playbook_dir }}/../bundle"

# HTTPS is optional. Leave tls_cert_file and tls_key_file empty to use plain HTTP.
# To turn HTTPS on, enter the paths of the certificate and key on the controller.
tls_cert_file: ''
tls_key_file: ''
tls_ca_file: ''      # optional: the CA that signed the certificate

# Do not edit the three lines below
tls_active: "{{ (tls_cert_file | length > 0) and (tls_key_file | length > 0) }}"
tls_scheme: "{{ 'https' if tls_active | bool else 'http' }}"
tls_ca_effective: "{{ tls_ca_file if tls_ca_file | length > 0 else tls_cert_file }}"
offline_repo_url: "CHANGE_ME"   # set to http://<repo-server>:8080
