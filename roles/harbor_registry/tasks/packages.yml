---
- name: Install Docker and the helper packages from the offline repo
  ansible.builtin.dnf:
    name: "{{ harbor_packages }}"
    state: present
    allowerasing: true

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Let Harbor's installer find docker-compose
  ansible.builtin.file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
