---
- name: Create the etcd user
  ansible.builtin.user:
    name: etcd
    system: true
    shell: /sbin/nologin
    home: "{{ etcd_data_dir }}"
    create_home: false

- name: Create the etcd data folder
  ansible.builtin.file:
    path: "{{ etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Create the etcd config folder
  ansible.builtin.file:
    path: /etc/etcd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the etcd HTTPS folder
  ansible.builtin.file:
    path: /etc/etcd/tls
    state: directory
    owner: etcd
    group: etcd
    mode: "0750"
  when: tls_active | bool

- name: Copy the HTTPS files for etcd
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/etc/etcd/tls/{{ item.dest }}"
    owner: etcd
    group: etcd
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ tls_cert_file }}", dest: server.crt, mode: "0644" }
    - { src: "{{ tls_key_file }}", dest: server.key, mode: "0600" }
    - { src: "{{ tls_ca_effective }}", dest: ca.crt, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  when: tls_active | bool
  notify: Restart etcd

- name: Unpack etcd from the bundle
  ansible.builtin.unarchive:
    src: "{{ bundle_dir }}/third-party-binaries/etcd-{{ etcd_version }}-linux-amd64.tar.gz"
    dest: "{{ etcd_install_dir }}"
    owner: root
    group: root
    creates: "{{ etcd_install_dir }}/etcd-{{ etcd_version }}-linux-amd64/etcd"

- name: Link etcd and etcdctl into /usr/local/bin
  ansible.builtin.file:
    src: "{{ etcd_install_dir }}/etcd-{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop:
    - etcd
    - etcdctl

- name: Write the etcd configuration
  ansible.builtin.template:
    src: etcd.yml.j2
    dest: /etc/etcd/etcd.yml
    owner: root
    group: root
    mode: "0644"
  notify: Restart etcd

- name: Write the etcd service file
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart etcd

- name: Apply the etcd changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start etcd
  ansible.builtin.systemd_service:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true

- name: Wait until etcd is healthy
  ansible.builtin.command: >-
    /usr/local/bin/etcdctl
    {{ '--insecure-skip-tls-verify' if tls_active | bool else '' }}
    --endpoints={{ tls_scheme }}://127.0.0.1:{{ etcd_client_port }} endpoint health
  register: database_etcd_health
  until: database_etcd_health.rc == 0
  retries: 15
  delay: 4
  changed_when: false
