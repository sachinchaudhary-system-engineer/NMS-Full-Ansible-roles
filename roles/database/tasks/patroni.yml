---
- name: Copy the Patroni wheels from the bundle
  ansible.builtin.copy:
    src: "{{ bundle_dir }}/patroni-python-wheels/"
    dest: "{{ patroni_wheels_dir }}/"
    owner: root
    group: root
    mode: "0644"

- name: Install Patroni from the wheels, no internet
  ansible.builtin.pip:
    name:
      - patroni
      - psycopg2-binary
    virtualenv: "{{ patroni_venv }}"
    virtualenv_command: python3 -m venv
    extra_args: "--no-index --find-links={{ patroni_wheels_dir }}"

- name: Create the Patroni config folder
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create the Patroni HTTPS folder
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}/tls"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"
  when: tls_active | bool

- name: Copy the HTTPS files for Patroni and PostgreSQL
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ patroni_config_dir }}/tls/{{ item.dest }}"
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ tls_cert_file }}", dest: server.crt, mode: "0644" }
    - { src: "{{ tls_key_file }}", dest: server.key, mode: "0600" }
    - { src: "{{ tls_ca_effective }}", dest: ca.crt, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"
  when: tls_active | bool
  notify: Restart patroni

- name: Create the PostgreSQL data folder
  ansible.builtin.file:
    path: "{{ database_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write the Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_config_dir }}/patroni.yml"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart patroni

- name: Write the Patroni service file
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart patroni

- name: Apply the Patroni changes now
  ansible.builtin.meta: flush_handlers

- name: Enable and start Patroni
  ansible.builtin.systemd_service:
    name: patroni
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the Patroni REST API
  ansible.builtin.uri:
    url: "{{ tls_scheme }}://{{ database_ip }}:{{ patroni_restapi_port }}/health"
    status_code: 200
    validate_certs: false
  register: database_patroni_health
  until: database_patroni_health.status == 200
  retries: 30
  delay: 5

- name: Read the cluster state
  ansible.builtin.command: "{{ patroni_venv }}/bin/patronictl -c {{ patroni_config_dir }}/patroni.yml list"
  register: database_cluster
  run_once: true
  changed_when: false

- name: Show the cluster state
  ansible.builtin.debug:
    var: database_cluster.stdout_lines
  run_once: true
