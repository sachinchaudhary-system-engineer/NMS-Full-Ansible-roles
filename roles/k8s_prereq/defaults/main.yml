---
k8s_prereq_packages:
  - iproute-tc
  - conntrack-tools
  - socat
  - ipset
  - iptables-nft
  - nfs-utils
  - container-selinux

k8s_prereq_modules:
  - overlay
  - br_netfilter

k8s_prereq_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
